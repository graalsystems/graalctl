[package]
name = "graalctl"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
description = "Command-line interface for the graal Data Platform"
license = "Apache-2.0"
repository = "https://github.com/graalsystems/graalctl"
homepage = "https://graal.systems"
readme = "README.md"
keywords = ["graal", "data-platform", "cli", "spark", "kubernetes"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
dirs = "6"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
